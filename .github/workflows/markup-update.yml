name: Gravityforms
on:
  workflow_call:
    inputs:
      slug:
        required: true
        type: string
      source_url:
        required: false
        default: ''
        type: string
      changelog_awk_extract:
        # `|-`, not `|`. The action interpolates this into
        #   ${{ inputs.changelog_extract }} >> /tmp/commit-message
        # so a trailing newline here pushes the redirect onto its own line:
        #   awk … CHANGELOG.txt
        #    >> /tmp/commit-message
        # which is two statements. The awk then writes to stdout — visible in the
        # run log, so the changelog looks like it worked — while the bare redirect
        # appends nothing, and the commit message, the annotated tag built from it
        # and therefore the release body all stay empty.
        default: |-
          '/[0-9\.]+ \(.*\)/ { if (p) { exit }; if ($1 == ver) { p=1; next } } p && NF' CHANGELOG.txt
        type: string
    outputs:
      updated:
        description: "If the update didnt exist and was built"
        value: ${{ jobs.build.outputs.updated }}
      version:
        description: "The updated version"
        value: ${{ jobs.build.outputs.version }}
    secrets:
      LICENSE_KEY:
        required: false

jobs:
  build:
    name: Update plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.update.outputs.updated }}
      version: ${{ steps.update.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Retrieve the license information
        if:
        run: |
          {
            echo 'REMOTE_RESPONSE<<EOF'
            curl --get \
              -d "${{ secrets.LICENSE_KEY && format('license_key={0}', secrets.LICENSE_KEY) || '' }}" \
              -d "${{ inputs.source_url && format('site={0}', inputs.source_url) || '' }}" \
              'https://markup.fi/products/${{ inputs.slug }}/metadata.json'
            echo -e "\n"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Update repo
        uses: gppackagist/github-action-update-plugins@main
        id: update
        with:
          download_url: ${{ fromJson(env.REMOTE_RESPONSE).download_url }}
          version: ${{ fromJson(env.REMOTE_RESPONSE).version }}
          changelog_extract: |-
            awk -v ver=${{ fromJson(env.REMOTE_RESPONSE).version }} ${{ inputs.changelog_awk_extract }}
